# Point dbus-activated fprintd at the overlay libfprint.
# Install copies the .so to /var/usrlocal/lib64 (the real directory behind
# Silverblue's /usr/local symlink). Using the /var path works on both
# ostree and a mutable root. ProtectSystem=strict still allows reading it.
[Service]
Environment=LD_LIBRARY_PATH=/var/usrlocal/lib64
