# This machine's NHLT / live PCM is stereo 48 kHz S16_LE on device 0
# (after the AVS card-rename). Kernel 6.12 only opened
# arecord -Dhw:avsdmic,2 -r 48000 -c2 -f S16_LE; the renamed card moved
# that PCM to device 0. CaptureChannels is kept explicit because ACP
# still assumes stereo-or-fail when the UCM omits the count (see the
# 4-channel report on alsa-ucm-conf pull request 571).
#
# Live mixer 'DMIC Volume' defaults to 0 (digital silence). EnableSequence
# raises it so PipeWire HiFi capture is audible. Raw arecord in verify.sh
# sets the same control before recording.
SectionDevice."Mic" {
	Comment "Internal Digital Microphone"

	EnableSequence [
		cset "name='DMIC Volume' 70%"
	]

	Value {
		CapturePCM "hw:${CardId},0"
		CaptureChannels 2
		CaptureRate 48000
		CaptureMixerElem "DMIC"
	}
}
