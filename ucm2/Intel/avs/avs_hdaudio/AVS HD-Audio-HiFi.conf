# Analog speaker, headphone, and headset-mic devices for ALC255.
# /HDA/HiFi-analog.conf looks up Speaker / Headphone mixer controls that
# this codec already exposes. Analog capture has no Capture Switch under
# snd_soc_avs (BIOS mic pins N/A; sysfs reconfig oopses on this ASoC
# codec). AVS topology still exposes pcmC*D0c. The boot unit programs
# pin 0x19 with hwdep verbs. This Headset device binds that PCM.

Include.analog.File "/HDA/HiFi-analog.conf"

SectionDevice."Headset" {
	Comment "Headset Microphone"

	Value {
		CapturePriority 150
		CapturePCM "hw:${CardId},0"
		CaptureChannels 2
		CaptureRate 48000
		CaptureFormat "S32_LE"
		JackControl "Front Headphone Jack"
		JackDev "hw:${CardId}"
	}
}
