# Analog speaker, headphone, and headset-mic devices for ALC255.
# /HDA/HiFi-analog.conf looks up Speaker / Headphone mixer controls that
# this codec already exposes. DeviceMic names the analog capture device
# "Mic" so a headset mic (pin 0x19, enabled by the boot reconfig unit)
# can bind when those controls exist.
Define.DeviceMic "Mic"

Include.analog.File "/HDA/HiFi-analog.conf"
