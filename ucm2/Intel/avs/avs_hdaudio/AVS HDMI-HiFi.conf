# HDMI converters on this Kaby Lake SKU map 1→PCM 0, 2→PCM 1, 3→PCM 2.
# codecs/hda/hdmi.conf names the jack "HDMI/DP" when Device is 0, and
# "HDMI/DP,pcm=N" otherwise. It also programs IEC958 Playback Switch at
# index (Number - 1), so Number must be 1-based. Using Number 0 would
# produce index -1 (the bug in alsa-ucm-conf pull request 571).
Include.hdmi.File "/codecs/hda/hdmi.conf"

If.hdmi1 {
	Condition { Type AlwaysTrue }
	True.Macro.hdmi1.HDMI {
		Number 1
		Device 0
		Priority 1000
	}
}

If.hdmi2 {
	Condition { Type AlwaysTrue }
	True.Macro.hdmi2.HDMI {
		Number 2
		Device 1
		Priority 1001
	}
}

If.hdmi3 {
	Condition { Type AlwaysTrue }
	True.Macro.hdmi3.HDMI {
		Number 3
		Device 2
		Priority 1002
	}
}
